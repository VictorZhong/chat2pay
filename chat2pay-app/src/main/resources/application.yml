server:
  port: 8080

spring:
  application:
    name: chat2pay-app
  datasource:
    url: ${CHAT2PAY_DB_URL:jdbc:postgresql://localhost:5432/chat2pay}
    username: ${CHAT2PAY_DB_USERNAME:chat2pay}
    password: ${CHAT2PAY_DB_PASSWORD:chat2pay}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    table: ctp_flyway_schema_history
    locations: classpath:db/migration/postgresql

chat2pay:
  security:
    shared-password: tb123
  llm:
    enabled: true
    base-url: http://localhost:8000
    chat-path: /api/chat
    fallback-to-heuristics: true
  demo:
    default-source-account-id: acct_hk_primary_savings
    default-source-account-display: Primary Savings • 123-456-001
  downstream:
    mock-enabled: true
    login:
      url-template: https://testdataservices.apps.cf.wgdc-dn-03.cloud.uk.abcd/dsp/entity/HK/{username}/SAML3/30
      code: 123123
    payee:
      url: https://mmf-payee-management--hk-tktk-banking-1.abcd-dsvc-papi-hk01-tktk-cert.svc.default.shp.ape1.pre-prod.cloud.abcd/payees
      payee-category: INDIVIDUAL
      payee-type: "2"
      mock-payees:
        - payee-id-index: demo-payee-001
          payee-type: "6"
          name: BOB
          description: Registered local payee
    payment:
      confirm-url: https://dcc-hk-tktk-mvmny-domestic-payments-papi-3.abcd-dsvc-papi-hk01-tktk-cert.svc.default.shp.ape1.pre-prod.cloud.abcd/confirm-domestic-payments
      default-currency: HKD
      debit-account-acn: VEdTRlNCU0dTQlNHEpP3avL8TimV5LF2nbqGbba2fUVfkHsOGmwg9K1t43GQJgS5mnXu3_EvF0zwJmeFRslRn_min_CT9p_wuTR7nwoWHNdZuxAFiVO2GPQ=
